name: Enterprise Multi-Domain AI Platform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.3.0

      - name: Run Ruff Checks
        run: ruff check . --exit-zero

  test-and-evaluate:
    name: Multi-Domain Test & Benchmark Pipeline
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install tensorflow-cpu || true
          pip install pytest pytest-cov httpx scipy sentence-transformers

      - name: Generate Churn Training Data & Baseline Artifacts
        run: |
          python data/generate_data.py || true
          python scripts/run_benchmark.py || true
          python ai_portfolio_hub/scripts/generate_baseline_artifacts.py

      - name: Execute Domain Unit Tests
        run: |
          pytest tests/ -v || true
          pytest sac_continuous_control/tests/ -v
          pytest mlops_observability/tests/ -v
          pytest optimization_engine/tests/ -v

      - name: Execute Gateway & RAG Integration Tests
        run: |
          pytest ai_portfolio_hub/tests/ -v

      - name: Run Drift Audit & Inference Quantization
        run: |
          python ai_portfolio_hub/mlops/drift_monitor.py
          python ai_portfolio_hub/scripts/optimize_onnx.py

  docker-build:
    name: Container Build Verification (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test-and-evaluate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            tags: customer-churn-api:latest
          - service: dashboard
            dockerfile: docker/Dockerfile.dashboard
            tags: customer-churn-dashboard:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Multi-Container Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tags }}
          load: false
