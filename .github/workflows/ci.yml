name: Customer Churn CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.3.0

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Ruff Formatting Verification
        run: ruff format --check .

  test:
    name: Unit & Integration Tests (Coverage >= 80%)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Core & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Generate Training Data & Artifacts
        run: |
          python -m data.generate_data
          python -m src.train

      - name: Execute Pytest Suite with Strict Coverage Gate
        run: |
          pytest tests/ --cov=src --cov=api --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  docker-build:
    name: Container Build Verification (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            tags: customer-churn-api:latest
          - service: dashboard
            dockerfile: docker/Dockerfile.dashboard
            tags: customer-churn-dashboard:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Multi-Container Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tags }}
          load: false
