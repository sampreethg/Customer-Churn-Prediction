[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Production-grade Customer Churn Prediction platform, API, and Explainable AI simulator."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ML Engineering Team" }
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function call in argument defaults (standard for FastAPI Depends/BackgroundTasks)
    "E402",  # Module level import not at top of file (needed for sys.path bootstrapping in orchestrator)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "api", "dashboard", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --durations=10"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src", "api"]
omit = [
    "tests/*",
    "test_api.py",
    "data/generate_data.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
    "def __repr__",
]
